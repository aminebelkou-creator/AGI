name: AGI content validation
on:
  push:
    branches: [cms-test-smartsite]
    paths:
      - "content/**"
      - "scripts/validate_content_export.py"
      - "scripts/validate_reusable_content.py"
      - "scripts/validate_fact_register.py"
      - "scripts/audit_legacy_content.py"
      - "scripts/validate_migration_plan.py"
      - "scripts/validate_journal_reconciliation.py"
      - ".github/workflows/content-validation.yml"
  pull_request:
    paths:
      - "content/**"
      - "scripts/validate_content_export.py"
      - "scripts/validate_reusable_content.py"
      - "scripts/validate_fact_register.py"
      - "scripts/audit_legacy_content.py"
      - "scripts/validate_migration_plan.py"
      - ".github/workflows/content-validation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structured multilingual content
        run: python scripts/validate_content_export.py
      - name: Validate reusable multilingual content library
        run: python scripts/validate_reusable_content.py
      - name: Validate governed website fact register
        run: python scripts/validate_fact_register.py
      - name: Audit legacy route and news integrity
        run: python scripts/audit_legacy_content.py
      - name: Validate route review and information architecture
        run: python scripts/validate_migration_plan.py
      - name: Validate journal source and article reconciliation
        run: python scripts/validate_journal_reconciliation.py
